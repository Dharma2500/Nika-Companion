name: Minecraft mod build

on:
  push:
    branches: [main]
    paths:
      - "minecraft-mod/**"
      - ".github/workflows/minecraft-build.yml"
  pull_request:
    paths:
      - "minecraft-mod/**"
      - ".github/workflows/minecraft-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Fabric mod
        working-directory: minecraft-mod
        run: ./gradlew --no-daemon build

      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: nika-companion-fabric-1.21.11
          path: minecraft-mod/build/libs/nika-companion-0.1.0.jar
          if-no-files-found: error
