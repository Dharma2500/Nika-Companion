name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile all Python modules
        run: python -m compileall -q agent/src agent/tests

      - name: Lint
        run: ruff check agent

      - name: Run tests
        run: pytest

  source-overlay:
    name: Build source overlay archive
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package tracked source files
        run: |
          python - <<'PY'
          import subprocess
          import zipfile

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          with zipfile.ZipFile("nika-companion-source-overlay.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in tracked:
                  if name:
                      archive.write(name, name)
          PY

      - name: Upload source overlay
        uses: actions/upload-artifact@v4
        with:
          name: nika-companion-source-overlay
          path: nika-companion-source-overlay.zip
          if-no-files-found: error
          retention-days: 14
